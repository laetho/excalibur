name: Cross-platform build and release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: build:linux
            artifact: Excalibur-linux-amd64
          - os: macos-latest
            task: build:macos
            artifact: Excalibur-macos-universal
          - os: windows-latest
            task: build:windows
            artifact: Excalibur-windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve release version
        id: release
        shell: bash
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          fi

          if [[ -z "$tag" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use the form vX.Y.Z (for example, v1.2.3)." >&2
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # A manual release must build the existing tag, not the branch selected
          # in the workflow-dispatch form.
          ref: ${{ steps.release.outputs.ref || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set version from release tag
        if: steps.release.outputs.enabled == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node - "$RELEASE_VERSION" <<'NODE'
          const fs = require('node:fs')
          const version = process.argv[2]
          const path = 'build/config.yml'
          const input = fs.readFileSync(path, 'utf8')
          const pattern = /^  version:\s*["'][^"']+["']\s*$/m
          const matches = input.match(new RegExp(pattern.source, 'gm')) ?? []
          if (matches.length !== 1) {
            throw new Error(`expected exactly one info.version in ${path}, found ${matches.length}`)
          }
          fs.writeFileSync(path, input.replace(pattern, `  version: "${version}"`))
          NODE

      # setup-go and setup-node already cache the Go build/module caches and
      # pnpm's content-addressed store. Cache only reproducible generated
      # outputs here; node_modules and native packages are deliberately rebuilt.
      # There is no restore prefix because stale bindings or embedded assets
      # are less useful than a miss. OS/architecture scoping also keeps Task's
      # platform-specific checksums isolated.
      - name: Restore generated build cache
        uses: actions/cache@v4
        with:
          path: |
            .task/checksum
            frontend/bindings
            frontend/dist
          key: generated-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'Taskfile.yml', 'build/**/Taskfile.yml', 'frontend/**') }}

      - uses: arduino/setup-task@v2
        with:
          version: 3.49.1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Generate tagged release metadata
        if: steps.release.outputs.enabled == 'true'
        run: wails3 task common:update:build-assets

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run checks
        run: task test

      - name: Build native package
        run: task ${{ matrix.task }}

      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C bin -czf dist/Excalibur-linux-amd64.tar.gz Excalibur

      - name: Archive macOS package
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent bin/Excalibur.app dist/Excalibur-macos-universal.zip

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path bin/Excalibur.exe -DestinationPath dist/Excalibur-windows-amd64.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Excalibur-*
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum Excalibur-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_RELEASE_TAG"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use the form vX.Y.Z (for example, v1.2.3)." >&2
            exit 1
          fi
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Excalibur $tag" \
            --generate-notes
